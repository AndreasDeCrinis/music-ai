id: brassaranka
name: Brassaranka
sources:
- https://de.wikipedia.org/wiki/Brassaranka
- https://www.brassaranka.at/downloads
- https://www.brassaranka.at/_files/ugd/00e78a_67909573d10047669d756e0395d977d1.pdf
assumptions:
- Four flugelhorns and two trumpets follow the official 2026 stage plot; the six players
  can double, so this is a default arrangement rather than verified Sunchyme chair
  assignments.
- Austrian B-flat tenor horn and baritone use transposing treble clef (sounding a
  major ninth lower). Trombone and tuba use concert-pitch bass clef. Baritone is approximated
  by the MuseScore euphonium template.
- Optional vocal doubling is not inferred or added automatically.
- Drum notation uses General MIDI percussion flags and pitches 35-81 with one grid-step
  durations; articulation, fills and drum classification remain provisional.
