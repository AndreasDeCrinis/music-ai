[project]
name = "brass-transcriber"
version = "0.1.0"
description = "Local YourMT3+ transcription and provisional British brass band scoring"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "pretty-midi>=0.2.10",
    "music21>=9",
    "librosa>=0.10",
    "soundfile>=0.13",
    "matplotlib>=3.8",
    "imageio-ffmpeg>=0.6",
    "mt3-infer @ git+https://github.com/openmirlab/mt3-infer.git@d8cbd287470291dee335f84315c5a9b9ff6e6c8a",
    "transformers==4.43.4",
    "beat-this==1.1.0",
    "madmom",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18",
    "torch",
    "torchaudio",
    "torchvision",
    "basic-pitch==0.4.0",
    "onnxruntime>=1.18",
    # resampy (a Basic Pitch dependency) still imports pkg_resources.
    "setuptools<81",
]
[project.optional-dependencies]
# Linux images select a PyTorch build explicitly; macOS uses the default PyPI wheels.
cpu = ["torch", "torchaudio", "torchvision"]
cu126 = ["torch", "torchaudio", "torchvision"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27"]
[project.scripts]
brass-transcribe = "brass_transcriber.cli:main"
brass-web = "brass_transcriber.web:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/brass_transcriber"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
# Basic Pitch runs on its bundled ONNX model; its TensorFlow/CoreML backends are not used.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "coremltools; sys_platform == 'never'",
]

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom.git", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[tool.hatch.metadata]
allow-direct-references = true
