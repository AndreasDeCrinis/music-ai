# NVIDIA GPU override (requires the NVIDIA Container Toolkit on the host):
#   BRASS_BIND=0.0.0.0 BRASS_PORT=8000 docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
x-gpu-build: &gpu-build
  context: .
  target: app
  args:
    TORCH_VARIANT: cu126
x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]
services:
  app:
    build: *gpu-build
    deploy: *gpu
  models:
    build: *gpu-build
